[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "github-safe-publish"
version = "2.0.1"
description = "Optional advanced compiler and compatibility tools for the GitHub safe-publish guidance Skill"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography==50.0.1", "fonttools==4.64.0"]

[project.scripts]
github-safe-publish = "github_safe_publish.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
