name: Bug report
description: Report a reproducible non-sensitive defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private policy values, personal data, or local absolute paths
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: github-safe-publish 1.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use only generated or example.invalid data
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Publication impact
      description: Explain whether this causes an incorrect allow, deny, report, or recovery result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no credential, private identifier, private policy value, candidate value, or local absolute path
          required: true
