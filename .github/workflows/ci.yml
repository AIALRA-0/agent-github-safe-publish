name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: verify / tests
    runs-on: ubuntu-latest
    steps:
      # Read complete history because repository-history coverage is a tested invariant
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      # Use the supported Python line for the locked parser runtime
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      # Install native parsers required by the complete doctor check
      - name: Install native parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev binutils ffmpeg git-lfs

      # Install the exact Python parser versions used by the maintained runtime
      - name: Install Python parser dependencies
        run: python -m pip install -r requirements-gate.txt

      # Fail before tests when any declared parser layer cannot start
      - name: Verify runtime
        run: python -X utf8 scripts/safe_publish.py doctor --all

      # Exercise policy, parser, repository, resume, and publication contracts
      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v
