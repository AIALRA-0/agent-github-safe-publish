name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: verify / tests
    runs-on: ubuntu-latest
    steps:
      # Read complete history because repository-history coverage is a tested invariant
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      # Use the supported Python line for the locked parser runtime
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gate.txt

      # Install native parsers required by the complete doctor check
      - name: Install native parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev binutils ffmpeg git-lfs

      # Install the exact Python parser versions used by the maintained runtime
      - name: Install Python parser dependencies
        run: python -m pip install -r requirements-gate.txt

      # Download the pinned Gitleaks release and verify its official checksum before diagnosis.
      - name: Install verified Gitleaks
        run: python -X utf8 -c "import sys; sys.path.insert(0, 'scripts'); import safe_publish; safe_publish.ensure_gitleaks()"

      # Fail before tests when any declared parser layer cannot start
      - name: Verify runtime
        run: python -X utf8 scripts/safe_publish.py doctor --all

      # Exercise policy, parser, repository, resume, and publication contracts
      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v
