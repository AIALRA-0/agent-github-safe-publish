name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 11 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    steps:
      # Check out the complete source at an immutable official Action revision
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Initialize GitHub's source-code security analysis for Python
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: python

      # Analyze data flow and dangerous calls, then upload the result to Security
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: "/language:python"
