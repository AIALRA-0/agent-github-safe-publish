interface:
  display_name: "GitHub 安全发布"
  short_description: "所有 GitHub 上传前统一审计、脱敏并执行门禁"
  default_prompt: "Use $github-safe-publish before any GitHub push, publish, upload, sync, mirror, open-source, Release action, or equivalent Chinese request such as 推送、发布、上传、同步、镜像、开源、全量发布; keep the strict audit result and continue only when the exact copy receives publication allow or allow_with_risk plus explicit write authorization."

policy:
  allow_implicit_invocation: true
